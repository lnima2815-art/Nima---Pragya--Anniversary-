<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nima ❤️ Pragya</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            color: white;
            font-family: Georgia, serif;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background:
                radial-gradient(circle at center, #241016 0%, #050505 55%);
        }

        .small {
            font-family: Arial, sans-serif;
            letter-spacing: 5px;
            font-size: 11px;
            opacity: 0.6;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(42px, 12vw, 90px);
            font-weight: 400;
            letter-spacing: 3px;
        }

        .heart {
            font-size: 28px;
            margin: 18px 0;
            animation: heartbeat 1.5s infinite;
        }

        .date {
            font-family: Arial, sans-serif;
            letter-spacing: 8px;
            font-size: 13px;
            opacity: 0.7;
        }

        .line {
            width: 70px;
            height: 1px;
            background: white;
            opacity: 0.4;
            margin: 35px auto;
        }

        .quote {
            max-width: 330px;
            font-size: 18px;
            line-height: 1.8;
            font-style: italic;
            opacity: 0.8;
        }

        .scroll {
            position: absolute;
            bottom: 30px;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 4px;
            opacity: 0.45;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.25);
            }
        }
    </style>
</head>

<body>

<section class="hero">

    <div class="small">A STORY WRITTEN ACROSS THE DISTANCE</div>

    <h1>Nima</h1>

    <div class="heart">❤️</div>

    <h1>Pragya</h1>

    <div class="line"></div>

    <div class="date">18 • SEPTEMBER</div>

    <p class="quote">
        Some love stories are written together...
        ours was written across the distance.
    </p>

    <div class="scroll">SCROLL TO BEGIN</div>

</section>

</body>
</html>
